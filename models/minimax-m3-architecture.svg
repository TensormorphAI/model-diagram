<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="1240" viewBox="0 0 1270 1240" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="blockGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7354F"/>
      <stop offset="0.55" stop-color="#FB8E78"/>
      <stop offset="1" stop-color="#FDCB8C"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#111;stroke-width:2}
      .gbox{fill:#E3E3E3;stroke:#111;stroke-width:2}
      .lbl{font-size:17px;fill:#111;text-anchor:middle;dominant-baseline:central}
      .ln{stroke:#111;stroke-width:2.5;fill:none}
      .dot{stroke:#222;stroke-width:3;stroke-dasharray:3 3;fill:none}
      .note{font-size:22px;font-weight:700;fill:#111}
      .r{fill:#EE2A45}
    </style>
  </defs>

  <rect width="1270" height="1240" fill="#fff"/>

  <!-- Title -->
  <text x="470" y="58" font-size="62" font-weight="700" fill="#EE2A45" text-anchor="middle">MiniMax-M3 (428B)</text>

  <!-- Vocabulary note -->
  <text x="588" y="118" class="note">Vocabulary size of <tspan class="r">200k</tspan></text>
  <line x1="555" y1="185" x2="612" y2="135" class="dot"/>

  <!-- Outer model box -->
  <rect x="215" y="162" width="500" height="922" rx="42" fill="#E5E5E5" stroke="#111" stroke-width="2"/>

  <!-- Output path -->
  <line x1="468" y1="190" x2="468" y2="124" class="ln" marker-end="url(#arr)"/>
  <rect x="381" y="190" width="176" height="38" rx="10" class="box"/>
  <text x="469" y="209" class="lbl">Linear output layer</text>
  <line x1="468" y1="255" x2="468" y2="230" class="ln" marker-end="url(#arr)"/>
  <rect x="389" y="255" width="161" height="38" rx="10" class="box"/>
  <text x="469" y="274" class="lbl">Final RMSNorm</text>

  <!-- Transformer block -->
  <rect x="294" y="316" width="355" height="556" rx="36" fill="url(#blockGrad)" stroke="#111" stroke-width="2"/>

  <line x1="468" y1="348" x2="468" y2="295" class="ln" marker-end="url(#arr)"/>
  <circle cx="468" cy="363" r="15" fill="#fff" stroke="#111" stroke-width="2"/>
  <path d="M460,363 H476 M468,355 V371" stroke="#111" stroke-width="2.5"/>

  <line x1="468" y1="422" x2="468" y2="380" class="ln" marker-end="url(#arr)"/>
  <rect x="388" y="422" width="160" height="36" rx="10" class="gbox"/>
  <text x="468" y="440" class="lbl">MoE</text>

  <line x1="468" y1="502" x2="468" y2="460" class="ln" marker-end="url(#arr)"/>
  <rect x="388" y="502" width="160" height="36" rx="10" class="box"/>
  <text x="468" y="520" class="lbl">RMSNorm 2</text>

  <line x1="468" y1="599" x2="468" y2="540" class="ln" marker-end="url(#arr)"/>
  <polyline points="468,586 578,586 578,363 485,363" class="ln" marker-end="url(#arr)"/>
  <circle cx="468" cy="614" r="15" fill="#fff" stroke="#111" stroke-width="2"/>
  <path d="M460,614 H476 M468,606 V622" stroke="#111" stroke-width="2.5"/>

  <line x1="468" y1="662" x2="468" y2="631" class="ln" marker-end="url(#arr)"/>
  <rect x="368" y="662" width="198" height="72" rx="10" fill="#555" stroke="#111" stroke-width="2"/>
  <text x="467" y="688" class="lbl" fill="#fff" style="fill:#fff">GQA / MiniMax Sparse</text>
  <text x="467" y="710" class="lbl" style="fill:#fff">Attention</text>

  <line x1="468" y1="773" x2="468" y2="736" class="ln" marker-end="url(#arr)"/>
  <rect x="388" y="773" width="160" height="36" rx="10" class="box"/>
  <text x="468" y="791" class="lbl">RMSNorm 1</text>

  <polyline points="468,855 578,855 578,614 485,614" class="ln" marker-end="url(#arr)"/>
  <line x1="468" y1="955" x2="468" y2="811" class="ln" marker-end="url(#arr)"/>

  <!-- QK-Norm / Partial RoPE -->
  <rect x="198" y="642" width="134" height="40" rx="10" class="box"/>
  <text x="265" y="662" class="lbl">QK-Norm</text>
  <line x1="333" y1="662" x2="364" y2="672" class="ln" marker-end="url(#arr)"/>
  <rect x="194" y="695" width="134" height="40" rx="10" class="box"/>
  <text x="261" y="715" class="lbl">Partial RoPE</text>
  <line x1="329" y1="714" x2="364" y2="714" class="ln" marker-end="url(#arr)"/>

  <line x1="200" y1="740" x2="168" y2="828" class="dot"/>
  <text x="28" y="865" class="note">Native context</text>
  <text x="40" y="892" class="note"><tspan class="r">1M</tspan> tokens</text>

  <!-- 60x brace -->
  <text x="228" y="891" font-size="24" font-weight="600" class="r">60 ×</text>
  <path d="M312,826 C292,830 300,850 288,856 C300,862 292,884 320,890" fill="none" stroke="#111" stroke-width="3"/>


  <!-- Embedding / input -->
  <rect x="346" y="955" width="242" height="38" rx="10" class="box"/>
  <text x="467" y="974" class="lbl">Token embedding layer</text>
  <line x1="468" y1="1101" x2="468" y2="995" class="ln" marker-end="url(#arr)"/>
  <rect x="388" y="1101" width="160" height="38" rx="10" class="box"/>
  <text x="468" y="1120" class="lbl">Tokenized text</text>
  <line x1="468" y1="1177" x2="468" y2="1143" class="ln" marker-end="url(#arr)"/>
  <text x="465" y="1207" font-family="Menlo, Consolas, monospace" font-size="20" text-anchor="middle" fill="#111">Sample input text</text>

  <!-- Bottom-left note -->
  <line x1="228" y1="905" x2="110" y2="1060" class="dot"/>
  <text x="10" y="1083" class="note">First <tspan class="r">3</tspan> blocks use</text>
  <text x="10" y="1110" class="note">dense FFN with <tspan class="r">GQA</tspan></text>
  <text x="10" y="1137" class="note">and hidden size</text>
  <text x="10" y="1164" class="note"><tspan class="r">12,288</tspan> instead of</text>
  <text x="10" y="1191" class="note r">MiniMax Sparse</text>
  <text x="10" y="1218" class="note"><tspan class="r">Attention</tspan> and MoE</text>

  <!-- Embedding note -->
  <line x1="590" y1="995" x2="700" y2="1155" class="dot"/>
  <text x="632" y="1185" class="note">Embedding</text>
  <text x="632" y="1212" class="note">dimension of <tspan class="r">6,144</tspan></text>

  <!-- SwiGLU module -->
  <text x="860" y="155" font-size="23" font-weight="700" fill="#111">Feed forward (SwiGLU) module</text>
  <rect x="862" y="167" width="362" height="274" rx="26" fill="#E5E5E5" stroke="#222" stroke-width="2.5" stroke-dasharray="6 4"/>
  <rect x="887" y="193" width="150" height="44" rx="12" class="box"/>
  <text x="962" y="215" class="lbl">Linear layer</text>
  <rect x="888" y="285" width="150" height="44" rx="12" class="box"/>
  <text x="963" y="307" class="lbl">SiLU activation</text>
  <rect x="1049" y="285" width="150" height="44" rx="12" class="box"/>
  <text x="1124" y="307" class="lbl">Linear layer</text>
  <rect x="888" y="371" width="150" height="44" rx="12" class="box"/>
  <text x="963" y="393" class="lbl">Linear layer</text>
  <line x1="965" y1="371" x2="965" y2="331" class="ln" marker-end="url(#arr)"/>
  <line x1="965" y1="285" x2="965" y2="239" class="ln" marker-end="url(#arr)"/>
  <line x1="965" y1="262" x2="1034" y2="262" class="ln"/>
  <polyline points="1058,262 1123,262 1123,285" class="ln"/>
  <circle cx="1046" cy="262" r="12" fill="#fff" stroke="#111" stroke-width="2"/>
  <path d="M1040,256 L1052,268 M1052,256 L1040,268" stroke="#111" stroke-width="2.2"/>

  <line x1="1022" y1="425" x2="1055" y2="460" class="dot"/>
  <text x="912" y="485" font-size="23" font-weight="700" fill="#111">Input expert size: <tspan class="r">6,144</tspan></text>
  <text x="912" y="520" font-size="23" font-weight="700" fill="#111">Intermediate projection size:</text>
  <text x="912" y="546" font-size="23" font-weight="700" class="r">3,072</text>

  <!-- MoE layer -->
  <line x1="548" y1="440" x2="795" y2="600" stroke="#EE2A45" stroke-width="2.5" stroke-dasharray="4 4"/>
  <rect x="795" y="562" width="442" height="428" rx="42" fill="none" stroke="#EE2A45" stroke-width="3" stroke-dasharray="3 4"/>
  <text x="1080" y="620" font-size="27" font-weight="700" fill="#111">MoE layer</text>

  <line x1="835" y1="738" x2="895" y2="448" stroke="#111" stroke-width="1.5"/>

  <line x1="1007" y1="633" x2="1007" y2="587" class="ln" marker-end="url(#arr)"/>
  <circle cx="1007" cy="650" r="17" fill="#fff" stroke="#111" stroke-width="2"/>
  <path d="M998,650 H1016 M1007,641 V659" stroke="#111" stroke-width="2.5"/>

  <line x1="895" y1="733" x2="992" y2="666" class="ln" marker-end="url(#arr)"/>
  <line x1="1007" y1="735" x2="1007" y2="670" class="ln" marker-end="url(#arr)"/>
  <line x1="1120" y1="730" x2="1022" y2="666" class="ln" marker-end="url(#arr)"/>

  <rect x="810" y="738" width="160" height="36" rx="10" class="gbox"/>
  <text x="876" y="756" class="lbl">Feed forward</text>
  <rect x="938" y="770" width="34" height="34" rx="5" fill="#666"/>
  <text x="955" y="787" class="lbl" style="fill:#fff">1</text>

  <rect x="1043" y="733" width="158" height="36" rx="10" class="gbox"/>
  <text x="1122" y="751" class="lbl">Feed forward</text>
  <rect x="1160" y="764" width="50" height="34" rx="6" fill="#EE2A45"/>
  <text x="1185" y="781" class="lbl" style="fill:#fff">128</text>

  <text x="1008" y="772" font-size="30" font-weight="900" text-anchor="middle" fill="#111">· · ·</text>

  <line x1="1010" y1="872" x2="905" y2="792" class="ln" marker-end="url(#arr)"/>
  <line x1="1010" y1="872" x2="1010" y2="792" class="ln" marker-end="url(#arr)"/>
  <line x1="1010" y1="872" x2="1118" y2="787" class="ln" marker-end="url(#arr)"/>
  <rect x="960" y="876" width="94" height="50" rx="10" fill="#fff" stroke="#EE2A45" stroke-width="2.5"/>
  <text x="1007" y="901" class="lbl" style="font-size:20px">Router</text>
  <line x1="1010" y1="968" x2="1010" y2="930" class="ln" marker-end="url(#arr)"/>

  <!-- Resource savings -->
  <text x="898" y="1030" font-size="22" font-weight="700" class="r">Resource savings:</text>
  <g font-size="22" fill="#111">
    <circle cx="904" cy="1056" r="3.5" fill="#111"/>
    <text x="926" y="1064">Model size is <tspan class="r">428B</tspan></text>
    <circle cx="904" cy="1092" r="3.5" fill="#111"/>
    <text x="926" y="1100">but only <tspan class="r">4 experts</tspan> active per</text>
    <text x="926" y="1126">token + <tspan class="r">1</tspan> shared expert</text>
    <circle cx="904" cy="1152" r="3.5" fill="#111"/>
    <text x="926" y="1160">only <tspan class="r">23B</tspan> parameters are active</text>
    <text x="926" y="1186">per inference step (i.e., only</text>
    <text x="926" y="1213"><tspan class="r">5.37%</tspan> parameters active)</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
