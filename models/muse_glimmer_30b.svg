<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 1310" width="1220" height="1310" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
    <style>
      .box { fill: #fff; stroke: #222; stroke-width: 2; }
      .bbox { fill: #fff; stroke: #8fd0ff; stroke-width: 2.5; }
      .lbl { font-size: 17px; fill: #111; text-anchor: middle; dominant-baseline: middle; }
      .ln { stroke: #111; stroke-width: 2.5; fill: none; }
      .dot { stroke: #111; stroke-width: 4; stroke-dasharray: 3 5; fill: none; }
      .note { font-size: 23px; font-weight: bold; fill: #111; }
      .hl { fill: #1f6fe8; }
    </style>
  </defs>

  <rect width="1220" height="1310" fill="#fff"/>

  <!-- Title -->
  <text x="485" y="58" font-size="66" font-weight="bold" fill="#1f6fe8" text-anchor="middle">Muse Glimmer (30B)</text>
  <text x="485" y="107" font-size="22" fill="#111" text-anchor="middle">(Vision perception encoder omitted)</text>

  <!-- Outer model container -->
  <rect x="200" y="195" width="515" height="962" rx="42" fill="#d9d9d9" stroke="#222" stroke-width="2.5"/>
  <!-- Transformer block -->
  <rect x="283" y="353" width="365" height="575" rx="42" fill="#3d8ff5" stroke="#222" stroke-width="2"/>

  <!-- Main data path arrows -->
  <line class="ln" x1="461" y1="1252" x2="461" y2="1217" marker-end="url(#arr)"/>
  <line class="ln" x1="461" y1="1175" x2="461" y2="1060" marker-end="url(#arr)"/>
  <line class="ln" x1="461" y1="1020" x2="461" y2="992" marker-end="url(#arr)"/>
  <line class="ln" x1="461" y1="952" x2="461" y2="887" marker-end="url(#arr)"/>
  <line class="ln" x1="461" y1="847" x2="461" y2="820" marker-end="url(#arr)"/>
  <line class="ln" x1="461" y1="746" x2="461" y2="725" marker-end="url(#arr)"/>
  <line class="ln" x1="461" y1="685" x2="461" y2="676"/>
  <line class="ln" x1="461" y1="646" x2="461" y2="602" marker-end="url(#arr)"/>
  <line class="ln" x1="461" y1="562" x2="461" y2="535" marker-end="url(#arr)"/>
  <line class="ln" x1="461" y1="495" x2="461" y2="472" marker-end="url(#arr)"/>
  <line class="ln" x1="461" y1="432" x2="461" y2="417"/>
  <line class="ln" x1="461" y1="387" x2="461" y2="330" marker-end="url(#arr)"/>
  <line class="ln" x1="461" y1="290" x2="461" y2="263" marker-end="url(#arr)"/>
  <line class="ln" x1="461" y1="223" x2="461" y2="155" marker-end="url(#arr)"/>

  <!-- Residual connections -->
  <polyline class="ln" points="461,910 574,910 574,660 477,660" marker-end="url(#arr)"/>
  <polyline class="ln" points="461,630 574,630 574,401 477,401" marker-end="url(#arr)"/>

  <!-- Add nodes -->
  <circle cx="461" cy="401" r="14" fill="#fff" stroke="#111" stroke-width="2"/>
  <path d="M452,401 h18 M461,392 v18" stroke="#111" stroke-width="2"/>
  <circle cx="461" cy="660" r="14" fill="#fff" stroke="#111" stroke-width="2"/>
  <path d="M452,660 h18 M461,651 v18" stroke="#111" stroke-width="2"/>

  <!-- Boxes in main column -->
  <rect class="box" x="375" y="223" width="175" height="38" rx="8"/>
  <text class="lbl" x="462" y="242">Linear output layer</text>
  <rect class="box" x="380" y="290" width="165" height="38" rx="8"/>
  <text class="lbl" x="462" y="309">Final RMSNorm</text>

  <rect class="bbox" x="382" y="432" width="160" height="38" rx="8"/>
  <text class="lbl" x="462" y="451">Post-RMSNorm 2</text>
  <rect x="380" y="495" width="163" height="38" rx="8" fill="#d0d0d0" stroke="#222" stroke-width="2"/>
  <text class="lbl" x="461" y="514">Feed forward</text>
  <rect class="bbox" x="380" y="562" width="162" height="38" rx="8"/>
  <text class="lbl" x="461" y="581">Pre-RMSNorm 2</text>
  <rect class="bbox" x="376" y="685" width="164" height="38" rx="8"/>
  <text class="lbl" x="458" y="704">Post-RMSNorm 1</text>

  <rect x="360" y="746" width="200" height="72" rx="10" fill="#555" stroke="#222" stroke-width="2"/>
  <text x="460" y="767" font-size="16" fill="#fff" text-anchor="middle">3:1 (local:global)</text>
  <text x="460" y="789" font-size="17" fill="#fff" text-anchor="middle"><tspan fill="#5cc8ff" font-weight="bold">sliding window</tspan> and</text>
  <text x="460" y="810" font-size="17" fill="#fff" text-anchor="middle">gated GQA</text>

  <rect class="bbox" x="380" y="847" width="162" height="38" rx="8"/>
  <text class="lbl" x="461" y="866">Pre-RMSNorm 1</text>

  <rect class="box" x="337" y="952" width="248" height="38" rx="8"/>
  <text class="lbl" x="461" y="971">Scaleless RMSNorm</text>
  <rect class="box" x="337" y="1020" width="248" height="38" rx="8"/>
  <text class="lbl" x="461" y="1039">Token embedding layer</text>
  <rect class="box" x="378" y="1175" width="165" height="38" rx="8"/>
  <text class="lbl" x="460" y="1194">Tokenized text</text>
  <text x="460" y="1285" font-size="21" font-family="Courier New, monospace" fill="#111" text-anchor="middle">Sample input text</text>

  <!-- Side inputs to attention -->
  <rect class="bbox" x="157" y="678" width="183" height="38" rx="8"/>
  <text class="lbl" x="248" y="697">Scaleless QK-Norm</text>
  <line class="ln" x1="333" y1="716" x2="356" y2="740" marker-end="url(#arr)"/>
  <rect class="box" x="178" y="760" width="138" height="38" rx="8"/>
  <text class="lbl" x="247" y="779">RoPE / NoPE</text>
  <line class="ln" x1="316" y1="779" x2="356" y2="779" marker-end="url(#arr)"/>

  <!-- Repeat brace -->
  <text x="207" y="938" font-size="24" fill="#1f6fe8">52 ×</text>
  <path d="M302,885 q-14,0 -14,14 v14 q0,10 -12,14 q12,4 12,14 v14 q0,14 14,14" fill="none" stroke="#111" stroke-width="3"/>

  <!-- FFN detail panel -->
  <rect x="815" y="310" width="372" height="285" rx="25" fill="#d9d9d9" stroke="#111" stroke-width="3" stroke-dasharray="3 5"/>
  <rect class="box" x="840" y="336" width="155" height="46" rx="10"/>
  <text class="lbl" x="917" y="359">Linear layer</text>
  <rect class="box" x="840" y="430" width="155" height="46" rx="10"/>
  <text class="lbl" x="917" y="453">SiLU activation</text>
  <rect class="box" x="1007" y="430" width="155" height="46" rx="10"/>
  <text class="lbl" x="1084" y="453">Linear layer</text>
  <rect class="box" x="840" y="521" width="155" height="46" rx="10"/>
  <text class="lbl" x="917" y="544">Linear layer</text>
  <line class="ln" x1="918" y1="521" x2="918" y2="478" marker-end="url(#arr)"/>
  <line class="ln" x1="918" y1="430" x2="918" y2="384" marker-end="url(#arr)"/>
  <line class="ln" x1="918" y1="408" x2="992" y2="408"/>
  <polyline class="ln" points="1016,408 1082,408 1082,430"/>
  <circle cx="1004" cy="408" r="12" fill="#fff" stroke="#111" stroke-width="2"/>
  <path d="M998,402 l12,12 M1010,402 l-12,12" stroke="#111" stroke-width="2"/>

  <!-- Dotted callout connectors -->
  <line class="dot" x1="552" y1="228" x2="615" y2="172"/>
  <line class="dot" x1="548" y1="508" x2="815" y2="453"/>
  <line class="dot" x1="965" y1="570" x2="1002" y2="610"/>
  <line class="dot" x1="562" y1="805" x2="862" y2="925"/>
  <line class="dot" x1="165" y1="800" x2="130" y2="895"/>
  <line class="dot" x1="592" y1="1055" x2="726" y2="1090"/>

  <!-- Annotations -->
  <text class="note" x="615" y="168">Vocabulary size of <tspan class="hl">202k</tspan></text>

  <text class="note" x="878" y="652">Input dim.: <tspan class="hl">6,656</tspan></text>
  <text class="note" x="878" y="682">Intermediate dim.: <tspan class="hl">19,968</tspan></text>

  <text class="note" x="895" y="758">3:1 Local (sliding) to</text>
  <text class="note" x="895" y="788">global (full attention) ratio</text>
  <text class="note" x="895" y="817">with window size <tspan class="hl">2,048</tspan></text>

  <text class="note" x="895" y="872">Local:</text>
  <text class="note" x="895" y="903"><tspan class="hl">32</tspan> attention heads</text>
  <text class="note" x="895" y="932"><tspan class="hl">2</tspan> key &amp; value heads</text>

  <text class="note" x="895" y="988">Global:</text>
  <text class="note" x="895" y="1019"><tspan class="hl">32</tspan> attention heads</text>
  <text class="note" x="895" y="1048"><tspan class="hl">2</tspan> key &amp; value heads</text>

  <text class="note" x="8" y="943">Native context</text>
  <text class="note" x="8" y="972"><tspan class="hl">128k</tspan> tokens</text>

  <text class="note" x="740" y="1093">Embedding</text>
  <text class="note" x="740" y="1122">dimension of <tspan class="hl">6,656</tspan></text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
