<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 1290" width="1230" height="1290" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
    <style>
      .box { fill: #fff; stroke: #111; stroke-width: 2; }
      .lbl { font-size: 18px; fill: #111; text-anchor: middle; dominant-baseline: middle; }
      .flow { stroke: #111; stroke-width: 2.5; fill: none; }
      .dash { stroke: #111; stroke-width: 2.5; fill: none; stroke-dasharray: 6 6; }
      .note { font-size: 24px; font-weight: bold; fill: #111; }
      .pink { fill: #e3127d; }
      .blue { fill: #1a9fd8; }
    </style>
  </defs>

  <rect width="1230" height="1290" fill="#fff"/>

  <!-- Title -->
  <text x="478" y="62" text-anchor="middle" font-size="66" font-weight="bold" class="pink">Llama 3.2 (1B)</text>

  <!-- Outer model container -->
  <rect x="213" y="148" width="530" height="988" rx="60" fill="#e2e2e2" stroke="#111" stroke-width="2.5"/>

  <!-- Transformer block (pink) -->
  <rect x="298" y="310" width="374" height="592" rx="50" fill="#e3b6cb" stroke="#222" stroke-width="2"/>

  <!-- Main vertical flow -->
  <line class="flow" x1="482" y1="1232" x2="482" y2="1196" marker-end="url(#arrow)"/>
  <line class="flow" x1="482" y1="1154" x2="482" y2="1037" marker-end="url(#arrow)"/>
  <line class="flow" x1="482" y1="995" x2="482" y2="834" marker-end="url(#arrow)"/>
  <line class="flow" x1="482" y1="794" x2="482" y2="752" marker-end="url(#arrow)"/>
  <line class="flow" x1="482" y1="676" x2="482" y2="644" marker-end="url(#arrow)"/>
  <line class="flow" x1="482" y1="612" x2="482" y2="547" marker-end="url(#arrow)"/>
  <line class="flow" x1="482" y1="507" x2="482" y2="462" marker-end="url(#arrow)"/>
  <line class="flow" x1="482" y1="422" x2="482" y2="377" marker-end="url(#arrow)"/>
  <line class="flow" x1="482" y1="345" x2="482" y2="286" marker-end="url(#arrow)"/>
  <line class="flow" x1="482" y1="246" x2="482" y2="217" marker-end="url(#arrow)"/>
  <line class="flow" x1="482" y1="177" x2="482" y2="105" marker-end="url(#arrow)"/>

  <!-- Residual connections -->
  <polyline class="flow" points="482,883 597,883 597,627 499,627" marker-end="url(#arrow)"/>
  <polyline class="flow" points="482,596 597,596 597,360 499,360" marker-end="url(#arrow)"/>

  <!-- Add nodes -->
  <g stroke="#111" stroke-width="2.5" fill="#fff">
    <circle cx="482" cy="360" r="15"/>
    <circle cx="482" cy="627" r="15"/>
  </g>
  <g stroke="#111" stroke-width="2.5">
    <line x1="472" y1="360" x2="492" y2="360"/><line x1="482" y1="350" x2="482" y2="370"/>
    <line x1="472" y1="627" x2="492" y2="627"/><line x1="482" y1="617" x2="482" y2="637"/>
  </g>

  <!-- Boxes -->
  <rect class="box" x="392" y="177" width="180" height="38" rx="9"/>
  <text class="lbl" x="482" y="196">Linear output layer</text>

  <rect class="box" x="398" y="246" width="168" height="38" rx="9"/>
  <text class="lbl" x="482" y="265">Final RMSNorm</text>

  <rect class="box" x="397" y="422" width="170" height="38" rx="9" style="fill:#e6e6e6"/>
  <text class="lbl" x="482" y="441">Feed forward</text>

  <rect class="box" x="397" y="507" width="168" height="38" rx="9"/>
  <text class="lbl" x="481" y="526">RMSNorm 2</text>

  <rect x="365" y="676" width="208" height="74" rx="10" fill="#555" stroke="#111" stroke-width="2"/>
  <text class="lbl" x="469" y="703" style="fill:#fff">Masked grouped-query</text>
  <text class="lbl" x="469" y="725" style="fill:#fff">attention</text>

  <rect class="box" x="397" y="794" width="168" height="38" rx="9"/>
  <text class="lbl" x="481" y="813">RMSNorm 1</text>

  <rect class="box" x="183" y="694" width="142" height="40" rx="9"/>
  <text class="lbl" x="254" y="714">RoPE</text>
  <line class="flow" x1="325" y1="714" x2="363" y2="714" marker-end="url(#arrow)"/>

  <rect class="box" x="353" y="995" width="258" height="40" rx="9"/>
  <text class="lbl" x="482" y="1015">Token embedding layer</text>

  <rect class="box" x="396" y="1154" width="170" height="40" rx="9"/>
  <text class="lbl" x="481" y="1174">Tokenized text</text>

  <text x="480" y="1268" text-anchor="middle" font-family="Courier New, monospace" font-size="21" fill="#111">Sample input text</text>

  <!-- 16x repeat with brace -->
  <text x="228" y="922" font-size="24" class="pink">16 ×</text>
  <path d="M322,856 C300,858 306,878 300,895 C296,905 286,908 282,910 C286,912 296,915 300,925 C306,942 300,920 324,922" fill="none" stroke="#111" stroke-width="2.5"/>

  <!-- Annotations -->
  <line class="dash" x1="572" y1="200" x2="636" y2="118"/>
  <text class="note" x="653" y="120">Vocabulary size of <tspan class="pink">128k</tspan></text>

  <line class="dash" x1="582" y1="712" x2="780" y2="630"/>
  <text class="note" x="795" y="634"><tspan class="pink">32</tspan> heads</text>

  <line class="dash" x1="170" y1="742" x2="133" y2="842"/>
  <text class="note" x="8" y="876">Native context</text>
  <text class="note" x="8" y="906"><tspan class="blue">128k</tspan> tokens</text>
  <text class="note" x="8" y="936">Llama <tspan class="blue">3</tspan> RoPE</text>

  <line class="dash" x1="630" y1="1020" x2="770" y2="1050"/>
  <text class="note" x="780" y="1057">Embedding</text>
  <text class="note" x="780" y="1087">dimension of <tspan class="pink">2,048</tspan></text>

  <!-- Feed-forward detail inset -->
  <line class="dash" x1="567" y1="440" x2="835" y2="383"/>
  <rect x="835" y="275" width="380" height="293" rx="30" fill="#e6e6e6" stroke="#111" stroke-width="3.5" stroke-dasharray="3 5"/>

  <rect class="box" x="860" y="303" width="160" height="46" rx="11"/>
  <text class="lbl" x="940" y="326">Linear layer</text>

  <rect class="box" x="860" y="400" width="160" height="46" rx="11"/>
  <text class="lbl" x="940" y="423">SiLU activation</text>

  <rect class="box" x="1031" y="400" width="160" height="46" rx="11"/>
  <text class="lbl" x="1111" y="423">Linear layer</text>

  <rect class="box" x="860" y="493" width="160" height="46" rx="11"/>
  <text class="lbl" x="940" y="516">Linear layer</text>

  <line class="flow" x1="940" y1="493" x2="940" y2="448" marker-end="url(#arrow)"/>
  <line class="flow" x1="940" y1="400" x2="940" y2="351" marker-end="url(#arrow)"/>
  <line class="flow" x1="940" y1="377" x2="1017" y2="377"/>
  <polyline class="flow" points="1041,377 1110,377 1110,400"/>
  <circle cx="1029" cy="377" r="12" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <g stroke="#111" stroke-width="2.5">
    <line x1="1023" y1="371" x2="1035" y2="383"/>
    <line x1="1035" y1="371" x2="1023" y2="383"/>
  </g>

  <line class="dash" x1="972" y1="542" x2="962" y2="660"/>
  <text class="note" x="906" y="698">Hidden layer</text>
  <text class="note" x="906" y="728">dimension of <tspan class="pink">8,192</tspan></text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
