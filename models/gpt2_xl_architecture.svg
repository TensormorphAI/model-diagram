  <rect x="874" y="246" width="248" height="296" rx="30" fill="#d9d9d9" stroke="#000" stroke-width="3" stroke-dasharray="4 4"/>
  <line class="flow" x1="998" y1="468" x2="998" y2="423" marker-end="url(#arrow)"/>
  <line class="flow" x1="998" y1="373" x2="998" y2="325" marker-end="url(#arrow)"/>
  <rect class="box" x="917" y="277" width="160" height="46" rx="10"/>
  <text class="lbl" x="997" y="300">Linear layer</text>
  <rect class="box" x="917" y="373" width="162" height="48" rx="10"/>
  <text class="lbl" x="998" y="397">GELU activation</text>
  <rect class="box" x="918" y="468" width="160" height="48" rx="10"/>
  <text class="lbl" x="998" y="492">Linear layer</text>

