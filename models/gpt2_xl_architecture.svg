  <rect class="box" x="414" y="410" width="168" height="40" rx="10"/>
  <text class="lbl" x="498" y="430">Dropout</text>

  <rect class="box" x="412" y="478" width="170" height="40" rx="10" style="fill:#d0d0d0"/>
  <text class="lbl" x="497" y="498">Feed forward</text>

  <rect class="box" x="412" y="546" width="170" height="40" rx="10"/>
  <text class="lbl" x="497" y="566">LayerNorm 2</text>

  <rect class="box" x="414" y="676" width="168" height="40" rx="10"/>
  <text class="lbl" x="498" y="696">Dropout</text>

  <rect class="box" x="402" y="740" width="188" height="68" rx="10" style="fill:#595959"/>
  <text class="lbl" x="496" y="764" style="fill:#fff">Masked multi-head</text>
  <text class="lbl" x="496" y="787" style="fill:#fff">attention</text>

  <rect class="box" x="411" y="840" width="170" height="40" rx="10"/>
  <text class="lbl" x="496" y="860">LayerNorm 1</text>

  <rect class="box" x="411" y="940" width="168" height="40" rx="10"/>
  <text class="lbl" x="495" y="960">Dropout</text>

  <rect class="box" x="367" y="1008" width="260" height="40" rx="10"/>
  <text class="lbl" x="497" y="1028">Positional embedding layer</text>

  <rect class="box" x="367" y="1086" width="260" height="40" rx="10"/>
  <text class="lbl" x="497" y="1106">Token embedding layer</text>

  <rect class="box" x="412" y="1176" width="170" height="40" rx="10"/>
  <text class="lbl" x="497" y="1196">Tokenized text</text>

  <text x="494" y="1290" font-family="Courier New, Courier, monospace" font-size="22" text-anchor="middle" fill="#111">Every effort moves you</text>

  <!-- Repeat brace -->
  <text x="232" y="942" font-size="26" font-weight="bold" class="num">48 <tspan font-size="32" font-weight="normal">×</tspan></text>
  <path d="M332,876 C313,878 313,890 313,900 L313,903 C313,911 306,913 295,913 C306,913 313,915 313,923 L313,926 C313,936 313,944 332,946" fill="none" stroke="#000" stroke-width="3"/>

