  <line class="dots" x1="535" y1="185" x2="598" y2="132"/>
  <line class="dots" x1="590" y1="514" x2="888" y2="458"/>
  <line class="dots" x1="1074" y1="520" x2="1050" y2="635" style="stroke-width:2.5;stroke-dasharray:0.1 5"/>
  <line class="dots" x1="592" y1="740" x2="803" y2="652"/>
  <line class="dots" x1="643" y1="1023" x2="800" y2="975"/>
  <line class="dots" x1="356" y1="1052" x2="102" y2="1158"/>
  <line class="dots" x1="612" y1="1140" x2="710" y2="1216"/>

  <!-- Annotations -->
  <text class="note" x="602" y="127">Vocabulary size of <tspan class="num">50k</tspan></text>
  <text class="note" x="808" y="649"><tspan class="num">25</tspan> heads</text>
  <text class="note" x="968" y="676">Hidden layer</text>
  <text class="note" x="968" y="706">dimension of <tspan class="num">6,400</tspan></text>
  <text class="note" x="816" y="953">Learned absolute</text>
  <text class="note" x="816" y="983">positions for</text>
  <text class="note" x="816" y="1013"><tspan class="num">1,024</tspan> tokens</text>
  <text class="note" x="10" y="1212">Native context</text>
  <text class="note" x="10" y="1242"><tspan class="num">1,024</tspan> tokens</text>
  <text class="note" x="727" y="1215">Embedding</text>
  <text class="note" x="727" y="1245">dimension of <tspan class="num">1,600</tspan></text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
