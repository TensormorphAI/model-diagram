<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1310" width="1200" height="1310" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <style>
      .box { fill: #fff; stroke: #000; stroke-width: 2; }
      .lbl { font-size: 18px; text-anchor: middle; dominant-baseline: central; fill: #111; }
      .flow { stroke: #000; stroke-width: 2.5; fill: none; }
      .dots { stroke: #000; stroke-width: 4; stroke-dasharray: 0.1 8; stroke-linecap: round; fill: none; }
      .note { font-size: 25px; font-weight: bold; fill: #111; }
      .num { fill: #1f7ac2; }
    </style>
  </defs>

  <rect width="1200" height="1310" fill="#fff"/>

  <!-- Title -->
  <text x="497" y="62" font-size="66" font-weight="bold" text-anchor="middle" fill="#111">GPT-2 XL (1.5B)</text>

  <!-- Outer container -->
  <rect x="220" y="163" width="530" height="992" rx="40" fill="#d9d9d9" stroke="#000" stroke-width="2.5"/>

  <!-- Transformer block -->
  <rect x="313" y="328" width="377" height="592" rx="40" fill="#a3bfd6" stroke="#000" stroke-width="2.5"/>

  <!-- Main vertical flow arrows -->
  <line class="flow" x1="497" y1="1252" x2="497" y2="1218" marker-end="url(#arrow)"/>
  <line class="flow" x1="497" y1="1176" x2="497" y2="1128" marker-end="url(#arrow)"/>
  <line class="flow" x1="497" y1="1086" x2="497" y2="1050" marker-end="url(#arrow)"/>
  <line class="flow" x1="497" y1="1008" x2="497" y2="982" marker-end="url(#arrow)"/>
  <line class="flow" x1="497" y1="940" x2="497" y2="882" marker-end="url(#arrow)"/>
  <line class="flow" x1="497" y1="840" x2="497" y2="810" marker-end="url(#arrow)"/>
  <line class="flow" x1="497" y1="740" x2="497" y2="718" marker-end="url(#arrow)"/>
  <line class="flow" x1="497" y1="676" x2="497" y2="661" marker-end="url(#arrow)"/>
  <line class="flow" x1="497" y1="631" x2="497" y2="588" marker-end="url(#arrow)"/>
  <line class="flow" x1="497" y1="546" x2="497" y2="520" marker-end="url(#arrow)"/>
  <line class="flow" x1="497" y1="478" x2="497" y2="452" marker-end="url(#arrow)"/>
  <line class="flow" x1="497" y1="410" x2="497" y2="393" marker-end="url(#arrow)"/>
  <line class="flow" x1="497" y1="363" x2="497" y2="304" marker-end="url(#arrow)"/>
  <line class="flow" x1="497" y1="262" x2="497" y2="235" marker-end="url(#arrow)"/>
  <line class="flow" x1="497" y1="193" x2="497" y2="122" marker-end="url(#arrow)"/>

  <!-- Residual connections -->
  <polyline class="flow" points="497,903 615,903 615,645 513,645" marker-end="url(#arrow)"/>
  <polyline class="flow" points="497,614 615,614 615,377 513,377" marker-end="url(#arrow)"/>

  <!-- Addition nodes -->
  <g stroke="#000" stroke-width="2.5">
    <circle cx="497" cy="377" r="14" fill="#fff"/>
    <line x1="487" y1="377" x2="507" y2="377"/>
    <line x1="497" y1="367" x2="497" y2="387"/>
    <circle cx="497" cy="645" r="14" fill="#fff"/>
    <line x1="487" y1="645" x2="507" y2="645"/>
