<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 1285" width="1230" height="1285" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
    <style>
      .box { fill: #fff; stroke: #111; stroke-width: 2; }
      .lbl { font-size: 19px; fill: #111; text-anchor: middle; dominant-baseline: middle; }
      .line { stroke: #111; stroke-width: 2.5; fill: none; }
      .dot { stroke: #111; stroke-width: 4; stroke-dasharray: 4 5; fill: none; }
      .note { font-size: 24px; font-weight: 700; fill: #111; }
      .blue { fill: #1a7fc1; }
    </style>
  </defs>

  <rect width="1230" height="1285" fill="#fff"/>

  <!-- Title -->
  <text x="455" y="62" font-size="66" font-weight="700" class="blue" text-anchor="middle">Llama 3 (8B)</text>

  <!-- Outer and inner containers -->
  <rect x="182" y="150" width="528" height="985" rx="60" fill="#d9d9d9" stroke="#111" stroke-width="2"/>
  <rect x="266" y="312" width="376" height="588" rx="45" fill="#a6a6a6" stroke="#111" stroke-width="2"/>

  <!-- Main flow arrows -->
  <line class="line" x1="450" y1="1230" x2="450" y2="1197" marker-end="url(#arrow)"/>
  <line class="line" x1="450" y1="1152" x2="450" y2="1039" marker-end="url(#arrow)"/>
  <line class="line" x1="450" y1="994" x2="450" y2="837" marker-end="url(#arrow)"/>
  <line class="line" x1="450" y1="794" x2="450" y2="756" marker-end="url(#arrow)"/>
  <line class="line" x1="450" y1="673" x2="450" y2="645" marker-end="url(#arrow)"/>
  <line class="line" x1="450" y1="611" x2="450" y2="550" marker-end="url(#arrow)"/>
  <line class="line" x1="450" y1="507" x2="450" y2="466" marker-end="url(#arrow)"/>
  <line class="line" x1="450" y1="423" x2="450" y2="378" marker-end="url(#arrow)"/>
  <line class="line" x1="450" y1="344" x2="450" y2="290" marker-end="url(#arrow)"/>
  <line class="line" x1="450" y1="247" x2="450" y2="221" marker-end="url(#arrow)"/>
  <line class="line" x1="450" y1="178" x2="450" y2="108" marker-end="url(#arrow)"/>

  <!-- Residual connections -->
  <polyline class="line" points="450,884 567,884 567,627 468,627" marker-end="url(#arrow)"/>
  <polyline class="line" points="450,597 567,597 567,360 468,360" marker-end="url(#arrow)"/>

  <!-- RoPE to attention -->
  <line class="line" x1="294" y1="714" x2="331" y2="714" marker-end="url(#arrow)"/>

  <!-- Plus nodes -->
  <g fill="#fff" stroke="#111" stroke-width="2.5">
    <circle cx="450" cy="360" r="16"/>
    <circle cx="450" cy="627" r="16"/>
  </g>
  <g stroke="#111" stroke-width="2.5">
    <line x1="441" y1="360" x2="459" y2="360"/><line x1="450" y1="351" x2="450" y2="369"/>
    <line x1="441" y1="627" x2="459" y2="627"/><line x1="450" y1="618" x2="450" y2="636"/>
  </g>

  <!-- Boxes -->
  <rect class="box" x="361" y="178" width="180" height="40" rx="12"/>
  <text class="lbl" x="451" y="198">Linear output layer</text>

  <rect class="box" x="367" y="247" width="168" height="40" rx="12"/>
  <text class="lbl" x="451" y="267">Final RMSNorm</text>

  <rect class="box" x="366" y="423" width="168" height="40" rx="12" style="fill:#e6e6e6"/>
  <text class="lbl" x="450" y="443">Feed forward</text>

  <rect class="box" x="366" y="507" width="168" height="40" rx="12"/>
  <text class="lbl" x="450" y="527">RMSNorm 2</text>

  <rect x="334" y="673" width="224" height="80" rx="14" fill="#555" stroke="#111" stroke-width="2"/>
  <text x="446" y="704" font-size="19" fill="#fff" text-anchor="middle" dominant-baseline="middle">Masked <tspan fill="#5ab4e8" font-weight="700">grouped-query</tspan></text>
  <text x="446" y="726" font-size="19" fill="#fff" text-anchor="middle" dominant-baseline="middle">attention</text>

  <rect class="box" x="366" y="794" width="166" height="40" rx="12"/>
  <text class="lbl" x="449" y="814">RMSNorm 1</text>

  <rect class="box" x="152" y="693" width="142" height="42" rx="12"/>
  <text class="lbl" x="223" y="714">RoPE</text>

  <rect class="box" x="322" y="994" width="256" height="42" rx="12"/>
  <text class="lbl" x="450" y="1015">Token embedding layer</text>

  <rect class="box" x="365" y="1152" width="168" height="41" rx="12"/>
  <text class="lbl" x="449" y="1173">Tokenized text</text>

  <text x="448" y="1265" font-family="Courier New, Courier, monospace" font-size="21" fill="#111" text-anchor="middle">Sample input text</text>

  <!-- 32x repeat brace -->
  <text x="193" y="920" font-size="28" class="blue">32 ×</text>
  <path d="M265,855 C248,858 254,880 258,890 C262,900 250,905 244,906 C250,907 262,912 258,922 C254,932 248,952 265,955" class="line" stroke-width="3"/>

  <!-- Annotations -->
  <line class="dot" x1="540" y1="175" x2="605" y2="120"/>
  <text class="note" x="624" y="122">Vocabulary size of <tspan class="blue">128k</tspan></text>

  <line class="dot" x1="565" y1="703" x2="750" y2="630"/>
  <text class="note" x="763" y="636"><tspan class="blue">32</tspan> heads</text>

  <line class="dot" x1="138" y1="742" x2="100" y2="840"/>
  <text class="note" x="8" y="890">Native context</text>
  <text class="note" x="8" y="920"><tspan class="blue">8,192</tspan> tokens</text>

  <line class="dot" x1="598" y1="1020" x2="740" y2="1050"/>
  <text class="note" x="750" y="1055">Embedding</text>
  <text class="note" x="750" y="1085">dimension of <tspan class="blue">4,096</tspan></text>

  <!-- Feed-forward detail inset -->
  <line class="dot" x1="540" y1="445" x2="805" y2="420"/>
  <rect x="805" y="278" width="408" height="290" rx="30" fill="#e0e0e0" stroke="#111" stroke-width="4" stroke-dasharray="4 5"/>

  <line class="line" x1="912" y1="494" x2="912" y2="450" marker-end="url(#arrow)"/>
  <line class="line" x1="912" y1="401" x2="912" y2="354" marker-end="url(#arrow)"/>
  <polyline class="line" points="912,378 986,378"/>
  <polyline class="line" points="1012,378 1080,378 1080,401"/>
  <circle cx="999" cy="378" r="13" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <g stroke="#111" stroke-width="2.5">
    <line x1="993" y1="372" x2="1005" y2="384"/><line x1="1005" y1="372" x2="993" y2="384"/>
  </g>

  <rect class="box" x="830" y="305" width="160" height="46" rx="12"/>
  <text class="lbl" x="910" y="328">Linear layer</text>

  <rect class="box" x="830" y="401" width="160" height="46" rx="12"/>
  <text class="lbl" x="910" y="424">SiLU activation</text>

  <rect class="box" x="1003" y="401" width="159" height="46" rx="12"/>
  <text class="lbl" x="1082" y="424">Linear layer</text>

  <rect class="box" x="830" y="494" width="160" height="46" rx="12"/>
  <text class="lbl" x="910" y="517">Linear layer</text>

  <line x1="942" y1="545" x2="932" y2="660" stroke="#111" stroke-width="3" stroke-dasharray="3 5"/>
  <text class="note" x="876" y="700">Hidden layer</text>
  <text class="note" x="876" y="729">dimension of <tspan class="blue">14,336</tspan></text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
