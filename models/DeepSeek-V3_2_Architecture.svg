<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 1245" width="1270" height="1245" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#222;stroke-width:2}
      .gbox{fill:#d9d9d9;stroke:#222;stroke-width:2}
      .lbl{font-size:17px;fill:#111;text-anchor:middle;dominant-baseline:middle}
      .ln{stroke:#111;stroke-width:2.5;fill:none}
      .dot{stroke:#111;stroke-width:3;stroke-dasharray:2 5;stroke-linecap:round;fill:none}
      .ann{font-size:22px;font-weight:700;fill:#111}
      .b{fill:#1a8cff}
      .txt{font-size:22px;fill:#111}
    </style>
  </defs>

  <rect width="1270" height="1245" fill="#fff"/>

  <!-- Title -->
  <text x="130" y="58" font-size="62" font-weight="700" fill="#1a8cff">DeepSeek-V3.2 (671B)</text>

  <!-- Outer and inner blocks -->
  <rect x="208" y="163" width="502" height="935" rx="50" fill="#d9d9d9" stroke="#222" stroke-width="2"/>
  <rect x="290" y="318" width="352" height="560" rx="40" fill="#7fb2f5" stroke="#222" stroke-width="2"/>

  <!-- Main vertical flow arrows -->
  <line class="ln" x1="462" y1="1188" x2="462" y2="1156" marker-end="url(#arr)"/>
  <line class="ln" x1="462" y1="1114" x2="462" y2="1004"/>
  <line class="ln" x1="462" y1="964" x2="462" y2="830" marker-end="url(#arr)"/>
  <line class="ln" x1="462" y1="790" x2="462" y2="766" marker-end="url(#arr)"/>
  <line class="ln" x1="462" y1="646" x2="462" y2="631"/>
  <line class="ln" x1="462" y1="603" x2="462" y2="544" marker-end="url(#arr)"/>
  <line class="ln" x1="462" y1="504" x2="462" y2="464" marker-end="url(#arr)"/>
  <line class="ln" x1="462" y1="424" x2="462" y2="378"/>
  <line class="ln" x1="462" y1="350" x2="462" y2="298" marker-end="url(#arr)"/>
  <line class="ln" x1="462" y1="258" x2="462" y2="232" marker-end="url(#arr)"/>
  <line class="ln" x1="462" y1="192" x2="462" y2="125" marker-end="url(#arr)"/>

  <!-- Residual connections -->
  <polyline class="ln" points="462,858 572,858 572,617 480,617" marker-end="url(#arr)"/>
  <polyline class="ln" points="462,588 572,588 572,364 480,364" marker-end="url(#arr)"/>

  <!-- Add nodes -->
  <g fill="#fff" stroke="#111" stroke-width="2">
    <circle cx="462" cy="364" r="14"/>
    <circle cx="462" cy="617" r="14"/>
  </g>
  <g stroke="#111" stroke-width="2">
    <line x1="453" y1="364" x2="471" y2="364"/><line x1="462" y1="355" x2="462" y2="373"/>
    <line x1="453" y1="617" x2="471" y2="617"/><line x1="462" y1="608" x2="462" y2="626"/>
  </g>

  <!-- Boxes -->
  <rect class="box" x="380" y="192" width="168" height="36" rx="10"/>
  <text class="lbl" x="464" y="211">Linear output layer</text>
  <rect class="box" x="385" y="258" width="158" height="36" rx="10"/>
  <text class="lbl" x="464" y="277">Final RMSNorm</text>
  <rect class="gbox" x="383" y="424" width="160" height="36" rx="10"/>
  <text class="lbl" x="463" y="443">MoE</text>
  <rect class="box" x="383" y="504" width="160" height="36" rx="10"/>
  <text class="lbl" x="463" y="523">RMSNorm 2</text>

  <rect x="350" y="646" width="208" height="116" rx="12" fill="#4a4a4a" stroke="#222" stroke-width="2"/>
  <g font-size="16" fill="#fff" text-anchor="middle">
    <text x="454" y="668">Multi-head <tspan fill="#ff7a7a">latent</tspan> attention</text>
    <text x="454" y="690">(MLA)</text>
    <text x="454" y="711">+</text>
    <text x="454" y="732">DeepSeek <tspan fill="#ff7a7a">Sparse</tspan></text>
    <text x="454" y="753">Attention (DSA)</text>
  </g>

  <rect class="box" x="383" y="790" width="160" height="36" rx="10"/>
  <text class="lbl" x="463" y="809">RMSNorm 1</text>
  <rect class="box" x="342" y="964" width="243" height="38" rx="10"/>
  <text class="lbl" x="463" y="984">Token embedding layer</text>
  <rect class="box" x="383" y="1114" width="160" height="38" rx="10"/>
  <text class="lbl" x="463" y="1134">Tokenized text</text>
  <text x="461" y="1222" font-family="Menlo, Courier New, monospace" font-size="19" text-anchor="middle" fill="#111">Sample input text</text>

  <!-- Partial RoPE -->
  <rect class="box" x="180" y="680" width="134" height="38" rx="10"/>
  <text class="lbl" x="247" y="700">Partial RoPE</text>
  <line class="ln" x1="316" y1="699" x2="344" y2="699" marker-end="url(#arr)"/>

  <!-- 61x brace -->
  <text x="220" y="895" font-size="22" font-weight="700" fill="#1a8cff">61 ×</text>
  <text x="268" y="895" font-size="64" fill="#111">{</text>

  <!-- Left annotations -->
  <text class="ann" x="12" y="853">YaRN context</text>
  <text class="ann" x="12" y="881"><tspan class="b">128k</tspan> tokens</text>
  <text class="ann" x="12" y="909"><tspan class="b">4k</tspan> RoPE base</text>
  <line class="dot" x1="165" y1="730" x2="132" y2="822"/>

  <text class="ann" x="8" y="1120">First <tspan class="b">3</tspan> blocks use</text>
  <text class="ann" x="8" y="1148">dense FFN with</text>
  <text class="ann" x="8" y="1176">hidden size <tspan class="b">18,432</tspan></text>
  <text class="ann" x="8" y="1204">instead of MoE</text>
  <line class="dot" x1="235" y1="910" x2="112" y2="1075"/>

  <!-- Bottom annotations -->
  <text class="ann" x="730" y="1115"><tspan class="b">128</tspan> heads</text>
  <line class="dot" x1="553" y1="740" x2="760" y2="1090"/>
  <text class="ann" x="626" y="1200">Embedding</text>
  <text class="ann" x="626" y="1228">dimension of <tspan class="b">7,168</tspan></text>
  <line class="dot" x1="583" y1="1006" x2="692" y2="1165"/>

  <!-- Vocabulary -->
  <text class="ann" x="583" y="118">Vocabulary size of <tspan class="b">129k</tspan></text>
  <line class="dot" x1="548" y1="186" x2="606" y2="138"/>

  <!-- Feed forward (SwiGLU) module -->
  <text class="ann" x="857" y="157">Feed forward (SwiGLU) module</text>
  <rect x="858" y="168" width="360" height="278" rx="22" fill="#d9d9d9" stroke="#222" stroke-width="3" stroke-dasharray="3 4"/>
  <rect class="box" x="882" y="194" width="150" height="46" rx="12"/>
  <text class="lbl" x="957" y="218">Linear layer</text>
  <rect class="box" x="882" y="286" width="150" height="46" rx="12"/>
  <text class="lbl" x="957" y="310">SiLU activation</text>
  <rect class="box" x="1045" y="286" width="150" height="46" rx="12"/>
  <text class="lbl" x="1120" y="310">Linear layer</text>
  <rect class="box" x="882" y="374" width="150" height="46" rx="12"/>
  <text class="lbl" x="957" y="398">Linear layer</text>
  <line class="ln" x1="960" y1="374" x2="960" y2="336" marker-end="url(#arr)"/>
  <line class="ln" x1="960" y1="286" x2="960" y2="244" marker-end="url(#arr)"/>
  <polyline class="ln" points="960,265 1030,265"/>
  <polyline class="ln" points="1054,265 1115,265 1115,286"/>
  <circle cx="1042" cy="265" r="12" fill="#fff" stroke="#111" stroke-width="2"/>
  <g stroke="#111" stroke-width="2">
    <line x1="1036" y1="259" x2="1048" y2="271"/><line x1="1048" y1="259" x2="1036" y2="271"/>
  </g>

  <text class="ann" x="972" y="482">Intermediate hidden</text>
  <text class="ann" x="972" y="510">layer dimension of</text>
  <text class="ann b" x="972" y="538">2,048</text>
  <line class="dot" x1="1015" y1="428" x2="1050" y2="462"/>

  <!-- Connectors to detail panels -->
  <line x1="545" y1="445" x2="790" y2="600" stroke="#1a8cff" stroke-width="4" stroke-dasharray="3 5" stroke-linecap="round"/>
  <line class="dot" x1="830" y1="740" x2="890" y2="452"/>

  <!-- MoE layer -->
  <rect x="790" y="566" width="440" height="436" rx="30" fill="none" stroke="#1a8cff" stroke-width="4" stroke-dasharray="4 5"/>
  <text x="1135" y="625" font-size="25" font-weight="700" fill="#111" text-anchor="middle">MoE layer</text>

  <line class="ln" x1="1003" y1="638" x2="1003" y2="590" marker-end="url(#arr)"/>
  <circle cx="1003" cy="654" r="16" fill="#fff" stroke="#111" stroke-width="2"/>
  <g stroke="#111" stroke-width="2">
    <line x1="992" y1="654" x2="1014" y2="654"/><line x1="1003" y1="643" x2="1003" y2="665"/>
  </g>
  <line class="ln" x1="890" y1="736" x2="988" y2="674" marker-end="url(#arr)"/>
  <line class="ln" x1="1003" y1="745" x2="1003" y2="674" marker-end="url(#arr)"/>
  <line class="ln" x1="1115" y1="735" x2="1018" y2="674" marker-end="url(#arr)"/>

  <rect class="gbox" x="805" y="742" width="160" height="36" rx="10"/>
  <text class="lbl" x="885" y="761">Feed forward</text>
  <rect x="932" y="772" width="36" height="36" rx="6" fill="#111"/>
  <text x="950" y="791" font-size="19" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">1</text>

  <rect class="gbox" x="1038" y="737" width="160" height="36" rx="10"/>
  <text class="lbl" x="1118" y="756">Feed forward</text>
  <rect x="1150" y="766" width="50" height="36" rx="6" fill="#1a8cff"/>
  <text x="1175" y="785" font-size="19" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">256</text>

  <text x="1003" y="780" font-size="30" font-weight="700" fill="#111" text-anchor="middle">· · ·</text>

  <line class="ln" x1="1003" y1="878" x2="900" y2="797" marker-end="url(#arr)"/>
  <line class="ln" x1="1003" y1="878" x2="1003" y2="797" marker-end="url(#arr)"/>
  <line class="ln" x1="1003" y1="878" x2="1112" y2="795" marker-end="url(#arr)"/>

  <rect x="958" y="880" width="90" height="50" rx="10" fill="#fff" stroke="#1a8cff" stroke-width="3"/>
  <text x="1003" y="906" font-size="19" fill="#1a6fd0" text-anchor="middle" dominant-baseline="middle">Router</text>
  <line class="ln" x1="1003" y1="972" x2="1003" y2="934" marker-end="url(#arr)"/>

  <!-- Resource savings -->
  <text x="893" y="1040" font-size="22" font-weight="700" fill="#1a8cff">Resource savings:</text>
  <g class="txt">
    <text x="896" y="1074">•</text>
    <text x="922" y="1074">Model size is <tspan class="b" font-weight="700">671B</tspan></text>
    <text x="896" y="1110">•</text>
    <text x="922" y="1110">but only <tspan class="b" font-weight="700">1 (shared) + 8 experts</tspan></text>
    <text x="922" y="1134">active per token</text>
    <text x="896" y="1170">•</text>
    <text x="922" y="1170">only <tspan class="b" font-weight="700">37B</tspan> parameters are active</text>
    <text x="922" y="1194">per inference step</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
