<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 1285" width="1230" height="1285" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
    <style>
      .box { fill: #fff; stroke: #111; stroke-width: 2.5; }
      .lbl { font-size: 19px; fill: #111; text-anchor: middle; dominant-baseline: middle; }
      .line { stroke: #111; stroke-width: 3; fill: none; }
      .dash { stroke: #111; stroke-width: 2.5; fill: none; stroke-dasharray: 6 6; }
      .note { font-size: 24px; font-weight: bold; fill: #111; }
      .pink { fill: #E6007E; }
      .blue { fill: #1E9BD7; }
    </style>
  </defs>

  <rect width="1230" height="1285" fill="#fff"/>

  <!-- Title -->
  <text x="447" y="62" font-size="66" font-weight="bold" class="pink" text-anchor="middle">Llama 3.2 (3B)</text>

  <!-- Outer model container -->
  <rect x="182" y="148" width="560" height="982" rx="50" fill="#DCDCDC" stroke="#111" stroke-width="2.5"/>

  <!-- Transformer block -->
  <rect x="266" y="310" width="406" height="590" rx="40" fill="#E2AEC6" stroke="#111" stroke-width="2.5"/>

  <!-- Main vertical data path -->
  <line class="line" x1="451" y1="1228" x2="451" y2="1194" marker-end="url(#arrow)"/>
  <line class="line" x1="451" y1="1150" x2="451" y2="1038" marker-end="url(#arrow)"/>
  <line class="line" x1="451" y1="994" x2="451" y2="836" marker-end="url(#arrow)"/>
  <line class="line" x1="451" y1="794" x2="451" y2="752" marker-end="url(#arrow)"/>
  <line class="line" x1="451" y1="676" x2="451" y2="646" marker-end="url(#arrow)"/>
  <line class="line" x1="451" y1="610" x2="451" y2="550" marker-end="url(#arrow)"/>
  <line class="line" x1="451" y1="508" x2="451" y2="464" marker-end="url(#arrow)"/>
  <line class="line" x1="451" y1="422" x2="451" y2="378" marker-end="url(#arrow)"/>
  <line class="line" x1="451" y1="342" x2="451" y2="287" marker-end="url(#arrow)"/>
  <line class="line" x1="451" y1="245" x2="451" y2="217" marker-end="url(#arrow)"/>
  <line class="line" x1="484" y1="175" x2="484" y2="106" marker-end="url(#arrow)"/>

  <!-- Residual connections -->
  <polyline class="line" points="451,885 598,885 598,627 470,627" marker-end="url(#arrow)"/>
  <polyline class="line" points="451,597 598,597 598,359 470,359" marker-end="url(#arrow)"/>

  <!-- Add nodes -->
  <g>
    <circle cx="451" cy="359" r="17" fill="#fff" stroke="#111" stroke-width="2.5"/>
    <path d="M441,359 H461 M451,349 V369" stroke="#111" stroke-width="2.5"/>
    <circle cx="451" cy="627" r="17" fill="#fff" stroke="#111" stroke-width="2.5"/>
    <path d="M441,627 H461 M451,617 V637" stroke="#111" stroke-width="2.5"/>
  </g>

  <!-- Boxes -->
  <rect class="box" x="362" y="175" width="210" height="40" rx="10"/>
  <text class="lbl" x="467" y="196">Linear output layer</text>

  <rect class="box" x="367" y="245" width="200" height="40" rx="10"/>
  <text class="lbl" x="467" y="266">Final RMSNorm</text>

  <rect x="365" y="422" width="175" height="40" rx="10" fill="#D0D0D0" stroke="#111" stroke-width="2.5"/>
  <text class="lbl" x="452" y="443">Feed forward</text>

  <rect class="box" x="365" y="508" width="175" height="40" rx="10"/>
  <text class="lbl" x="452" y="529">RMSNorm 2</text>

  <rect x="333" y="676" width="240" height="74" rx="12" fill="#4A4A4A" stroke="#111" stroke-width="2.5"/>
  <text class="lbl" x="453" y="703" fill="#fff" style="fill:#fff">Masked grouped-query</text>
  <text class="lbl" x="453" y="727" style="fill:#fff">attention</text>

  <rect class="box" x="367" y="794" width="168" height="40" rx="10"/>
  <text class="lbl" x="451" y="815">RMSNorm 1</text>

  <rect class="box" x="152" y="693" width="142" height="42" rx="10"/>
  <text class="lbl" x="223" y="715">RoPE</text>
  <line class="line" x1="294" y1="713" x2="331" y2="713" marker-end="url(#arrow)"/>

  <rect class="box" x="322" y="994" width="260" height="42" rx="10"/>
  <text class="lbl" x="452" y="1016">Token embedding layer</text>

  <rect class="box" x="367" y="1150" width="168" height="42" rx="10"/>
  <text class="lbl" x="451" y="1172">Tokenized text</text>

  <text x="449" y="1262" font-family="Courier New, monospace" font-size="22" text-anchor="middle" fill="#111">Sample input text</text>

  <!-- 28x repeat brace -->
  <path d="M272,858 C256,860 262,880 252,886 C262,892 256,912 272,918" class="line" stroke-width="3"/>
  <text x="194" y="922" font-size="26" class="pink">28 ×</text>

  <!-- Feed-forward detail -->
  <rect x="835" y="275" width="380" height="293" rx="30" fill="#DCDCDC" stroke="#111" stroke-width="3" stroke-dasharray="3 5"/>
  <rect class="box" x="859" y="303" width="160" height="46" rx="10"/>
  <text class="lbl" x="939" y="327">Linear layer</text>
  <rect class="box" x="859" y="400" width="160" height="46" rx="10"/>
  <text class="lbl" x="939" y="424">SiLU activation</text>
  <rect class="box" x="1031" y="400" width="160" height="46" rx="10"/>
  <text class="lbl" x="1111" y="424">Linear layer</text>
  <rect class="box" x="859" y="493" width="160" height="46" rx="10"/>
  <text class="lbl" x="939" y="517">Linear layer</text>
  <line class="line" x1="941" y1="493" x2="941" y2="448" marker-end="url(#arrow)"/>
  <line class="line" x1="941" y1="400" x2="941" y2="351" marker-end="url(#arrow)"/>
  <line class="line" x1="941" y1="378" x2="1016" y2="378"/>
  <polyline class="line" points="1042,378 1110,378 1110,400"/>
  <circle cx="1029" cy="378" r="13" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <path d="M1023,372 L1035,384 M1035,372 L1023,384" stroke="#111" stroke-width="2.2"/>

  <!-- Annotation leader lines -->
  <line class="dash" x1="573" y1="173" x2="635" y2="118"/>
  <line class="dash" x1="542" y1="442" x2="834" y2="383"/>
  <line class="dash" x1="588" y1="712" x2="780" y2="628"/>
  <line class="dash" x1="972" y1="547" x2="962" y2="660"/>
  <line class="dash" x1="140" y1="745" x2="105" y2="840"/>
  <line class="dash" x1="598" y1="1018" x2="770" y2="1052"/>

  <!-- Annotations -->
  <text x="655" y="120" class="note">Vocabulary size of <tspan class="pink">128k</tspan></text>
  <text x="792" y="635" class="note"><tspan class="pink">24</tspan> heads</text>
  <text x="906" y="700" class="note">Hidden layer</text>
  <text x="906" y="729" class="note">dimension of <tspan class="pink">8,192</tspan></text>
  <text x="8" y="876" class="note">Native context</text>
  <text x="8" y="905" class="note"><tspan class="blue">128k</tspan> tokens</text>
  <text x="8" y="934" class="note">Llama <tspan class="blue">3</tspan> RoPE</text>
  <text x="780" y="1056" class="note">Embedding</text>
  <text x="780" y="1085" class="note">dimension of <tspan class="pink">3,072</tspan></text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
