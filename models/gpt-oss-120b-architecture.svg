  <path class="ln" d="M500 890 H609 V650 H520" marker-end="url(#a)"/>
  <!-- residual 2 -->
  <path class="ln" d="M500 621 H609 V402 H520" marker-end="url(#a)"/>
  <!-- RoPE arrow -->
  <path class="ln" d="M358 731 H391" marker-end="url(#a)"/>

  <!-- Layer boxes -->
  <rect class="box" x="419" y="229" width="167" height="37" rx="9"/>
  <text class="t" x="430" y="254" textLength="145" lengthAdjust="spacingAndGlyphs">Linear output layer</text>

  <rect class="box" x="424" y="295" width="157" height="35" rx="9"/>
  <text class="t" x="441" y="318" textLength="122" lengthAdjust="spacingAndGlyphs">Final RMSNorm</text>

  <rect x="423" y="459" width="157" height="37" rx="9" fill="#d9d9d9" stroke="#000" stroke-width="2"/>
  <text class="t" x="484" y="484" textLength="36" lengthAdjust="spacingAndGlyphs">MoE</text>

  <rect class="box" x="423" y="538" width="157" height="37" rx="9"/>
