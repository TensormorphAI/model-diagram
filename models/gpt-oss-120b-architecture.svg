  <text class="b" x="890" y="194" textLength="350" lengthAdjust="spacingAndGlyphs">Feed forward (SwiGLU) module</text>
  <rect x="891" y="207" width="356" height="273" rx="28" fill="#d9d9d9" stroke="#000" stroke-width="4" stroke-dasharray="1 7" stroke-linecap="round"/>

  <rect class="box" x="915" y="231" width="149" height="45" rx="12"/>
  <text class="t" x="944" y="260" textLength="90" lengthAdjust="spacingAndGlyphs">Linear layer</text>
