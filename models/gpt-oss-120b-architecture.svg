<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1412 1300" width="1412" height="1300" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 12" refX="10" refY="6" markerWidth="10" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,6 L0,12 z" fill="#000"/>
    </marker>
    <style>
      .t { font-size: 18px; fill: #000; }
      .b { font-size: 23px; font-weight: 700; fill: #000; }
      .p { fill: #7B2FF7; }
      .box { fill: #fff; stroke: #000; stroke-width: 2; }
      .ln { fill: none; stroke: #000; stroke-width: 2; }
      .dot { fill: none; stroke: #000; stroke-width: 3.5; stroke-dasharray: 1 7; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1412" height="1300" fill="#fff"/>

  <!-- Title -->
  <text x="315" y="108" font-size="62" font-weight="700" fill="#7B2FF7" textLength="430" lengthAdjust="spacingAndGlyphs">gpt-oss (120B)</text>
  <text x="621" y="158" class="b" textLength="264" lengthAdjust="spacingAndGlyphs">Vocabulary size of <tspan class="p">200k</tspan></text>

  <!-- Outer model box -->
  <rect x="252" y="203" width="492" height="921" rx="58" fill="#d9d9d9" stroke="#000" stroke-width="2"/>
  <!-- Transformer block -->
  <rect x="331" y="355" width="348" height="552" rx="48" fill="#b399de" stroke="#000" stroke-width="2"/>

  <!-- Residual / flow lines -->
  <path class="ln" d="M502 229 V168" marker-end="url(#a)"/>
  <path class="ln" d="M502 295 V268" marker-end="url(#a)"/>
  <path class="ln" d="M501 387 V332" marker-end="url(#a)"/>
  <path class="ln" d="M501 459 V417" marker-end="url(#a)"/>
  <path class="ln" d="M501 538 V498" marker-end="url(#a)"/>
  <path class="ln" d="M500 636 V577"/>
  <path class="ln" d="M501 577 V577" />
  <path class="ln" d="M501 636 V577" marker-end="url(#a)"/>
  <path class="ln" d="M500 696 V666" marker-end="url(#a)"/>
  <path class="ln" d="M500 807 V768" marker-end="url(#a)"/>
  <path class="ln" d="M500 992 V845" marker-end="url(#a)"/>
  <path class="ln" d="M501 1141 V1032" marker-end="url(#a)"/>
  <path class="ln" d="M501 1232 V1187" marker-end="url(#a)"/>
