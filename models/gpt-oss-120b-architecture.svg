  <path d="M346 867 C326 867 326 880 326 892 C326 902 320 903 313 905 C320 907 326 910 326 920 C326 930 336 926 357 922" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <text x="264" y="925" font-size="27" font-weight="700" fill="#7B2FF7" textLength="52" lengthAdjust="spacingAndGlyphs">36 ×</text>

