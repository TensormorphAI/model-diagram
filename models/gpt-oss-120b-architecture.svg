  <path class="ln" d="M992 322 V282" marker-end="url(#a)"/>
  <path class="ln" d="M992 301 H1060 M1084 301 H1147 V322"/>
  <circle cx="1072" cy="301" r="12" fill="#fff" stroke="#000" stroke-width="2"/>
  <path d="M1065 294 L1079 308 M1079 294 L1065 308" stroke="#000" stroke-width="2"/>

  <path class="dot" d="M1046 462 L1080 498"/>
  <path class="dot" d="M925 480 L864 770"/>

  <text class="b" x="958" y="530" textLength="259" lengthAdjust="spacingAndGlyphs">Input expert size: <tspan class="p">2,880</tspan></text>
  <text class="b" x="958" y="563" textLength="384" lengthAdjust="spacingAndGlyphs">Intermediate projection size: <tspan class="p">2,880</tspan></text>

  <!-- MoE layer box -->
  <rect x="826" y="598" width="433" height="432" rx="42" fill="#fff" stroke="#7B2FF7" stroke-width="4" stroke-dasharray="1 8" stroke-linecap="round"/>
  <text class="b" x="1105" y="656" font-size="26" textLength="124" lengthAdjust="spacingAndGlyphs">MoE layer</text>

  <path class="ln" d="M1033 668 V622" marker-end="url(#a)"/>
  <circle cx="1033" cy="685" r="17" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <path d="M1022 685 H1044 M1033 674 V696" stroke="#000" stroke-width="2.5"/>

  <rect x="839" y="773" width="157" height="37" rx="9" fill="#d9d9d9" stroke="#000" stroke-width="2"/>
  <text class="t" x="866" y="797" textLength="102" lengthAdjust="spacingAndGlyphs">Feed forward</text>
  <rect x="965" y="805" width="34" height="33" rx="5" fill="#000"/>
  <text x="982" y="829" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">1</text>

  <rect x="1068" y="768" width="157" height="36" rx="9" fill="#d9d9d9" stroke="#000" stroke-width="2"/>
  <text class="t" x="1095" y="792" textLength="102" lengthAdjust="spacingAndGlyphs">Feed forward</text>
  <rect x="1181" y="798" width="49" height="34" rx="7" fill="#7B2FF7"/>
  <text x="1205.5" y="821" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">128</text>

  <g fill="#000">
    <circle cx="1014" cy="803" r="3.2"/>
    <circle cx="1034" cy="803" r="3.2"/>
    <circle cx="1054" cy="803" r="3.2"/>
  </g>

  <path class="ln" d="M922 766 L1024 710" marker-end="url(#a)"/>
  <path class="ln" d="M1033 768 V706" marker-end="url(#a)"/>
  <path class="ln" d="M1143 766 L1044 710" marker-end="url(#a)"/>

  <rect x="989" y="909" width="90" height="48" rx="13" fill="#fff" stroke="#7B2FF7" stroke-width="3.5"/>
  <text x="1003" y="941" font-size="21" fill="#000" textLength="63" lengthAdjust="spacingAndGlyphs">Router</text>
  <path class="ln" d="M1035 998 V960" marker-end="url(#a)"/>
  <path class="ln" d="M1034 909 L932 826" marker-end="url(#a)"/>
  <path class="ln" d="M1036 909 V827" marker-end="url(#a)"/>
  <path class="ln" d="M1038 909 L1142 826" marker-end="url(#a)"/>

  <!-- Resource savings -->
  <text class="b p" x="927" y="1067" textLength="206" lengthAdjust="spacingAndGlyphs">Resource savings:</text>
  <g font-size="22" fill="#000">
    <text x="926" y="1100">•</text>
    <text x="954" y="1100" textLength="198" lengthAdjust="spacingAndGlyphs">Model size is <tspan class="p" font-weight="700">120B</tspan></text>
    <text x="926" y="1133">•</text>
    <text x="954" y="1133" textLength="305" lengthAdjust="spacingAndGlyphs">but only <tspan class="p" font-weight="700">4 experts</tspan> active per</text>
    <text x="954" y="1158" textLength="57" lengthAdjust="spacingAndGlyphs">token</text>
    <text x="926" y="1193">•</text>
    <text x="954" y="1193" textLength="333" lengthAdjust="spacingAndGlyphs">only <tspan class="p" font-weight="700">5.1B</tspan> parameters are active</text>
    <text x="954" y="1218" textLength="189" lengthAdjust="spacingAndGlyphs">per inference step</text>
  </g>
