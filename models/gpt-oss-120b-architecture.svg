  <rect class="box" x="1075" y="322" width="149" height="45" rx="12"/>
  <text class="t" x="1104" y="351" textLength="90" lengthAdjust="spacingAndGlyphs">Linear layer</text>
  <rect class="box" x="915" y="410" width="149" height="45" rx="12"/>
  <text class="t" x="944" y="438" textLength="90" lengthAdjust="spacingAndGlyphs">Linear layer</text>

