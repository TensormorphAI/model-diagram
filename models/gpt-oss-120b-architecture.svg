  <path class="dot" d="M211 772 L180 860"/>
  <text class="b" x="60" y="897" textLength="152" lengthAdjust="spacingAndGlyphs">YaRN context</text>
  <text class="b" x="60" y="925" textLength="134" lengthAdjust="spacingAndGlyphs"><tspan class="p">128k</tspan> tokens</text>
  <text class="b" x="60" y="952" textLength="155" lengthAdjust="spacingAndGlyphs"><tspan class="p">4k</tspan> RoPE base</text>

