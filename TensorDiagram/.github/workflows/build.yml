name: Build

on:
  push:
    branches:
      - main
    paths:
      - '.github/actions/build-setup/**/*'
      - '.github/workflows/build.yml'
      - '.eslint*'
      - '.nvmrc'
      - 'packages/**/*'
      - '!packages/**/*.md'
      - '!packages/website/**/*'
      - 'scripts/build-all-examples.bash'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
  pull_request:
    branches:
      - main
    paths:
      - '.github/actions/build-setup/**/*'
      - '.github/workflows/build.yml'
      - '.eslint*'
      - '.nvmrc'
      - 'packages/**/*'
      - '!packages/**/*.md'
      - '!packages/website/**/*'
      - 'scripts/build-all-examples.bash'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      # we want to run the full build on all runners: don't cancel running jobs even if one fails
      fail-fast: false
      matrix:
        runner: [ 'ubuntu-24.04', 'macos-15', 'windows-2022']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Setup
        uses: ./.github/actions/build-setup

      - name: Build @tensormorph/tensordiagramcore
        run: bun run --cwd packages/core build

      - name: Check TS compilation of the tests of @tensormorph/tensordiagramcore
        run: bun run --cwd packages/core test-check
      - name: Test @tensormorph/tensordiagramcore
        run: bun run --cwd packages/core test --coverage
      - name: Upload test results as artifact
        uses: actions/upload-artifact@v7
        with:
          name: test-coverage-${{runner.os}}-${{github.sha}}
          path: packages/core/coverage/lcov-report
      - name: Test TypeScript support
        run: bun run --cwd packages/ts-support test

      # Already built in generate-website.yml, but here we want to ensure it can be built on all OSes
      - name: Build Storybook mini-site
        run: bun run --cwd packages/html build

      - name: Upload storybook mini-site as artifact
        uses: actions/upload-artifact@v7
        with:
          name: storybook-${{runner.os}}-${{github.sha}}
          path: |
            packages/html/dist/

      - name: Ensure no circular dependencies in the @tensormorph/tensordiagramcore produced JS files
        run: bun run --cwd packages/core check:circular-dependencies

      - name: Ensure no lint errors
        run: bun run lint

      # See https://github.com/arethetypeswrong/arethetypeswrong.github.io/tree/main/packages/cli
      - name: Check npm package
        run: bun run --cwd packages/core check:npm-package


  build_examples:
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/_reusable_build_examples.yml
    strategy:
      # we want to run the full build on all runners: don't cancel running jobs even if one fails
      fail-fast: false
      matrix:
        runner: ['ubuntu-24.04', 'macos-15', 'windows-2022']
    with:
     artifact-name: examples-${{ matrix.runner }}-${{ github.sha }}
     runner: ${{ matrix.runner }}
