name: 'Build Setup'
description: 'Setup node and bun, then install dependencies'

inputs:
  registry-url:
    description: 'Optional registry to set up for auth.'
    required: false

runs:
  using: 'composite'
  steps:
    # node still runs the tools (tsc, jest, vite, webpack), bun installs the dependencies and runs the scripts
    - name: Setup node
      uses: actions/setup-node@v6
      with:
        node-version-file: '.nvmrc'
        registry-url: ${{ inputs.registry-url }}
    - name: Setup bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: 'package.json'
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile --ignore-scripts
